<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Welcome | GrabSoMore</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 40px; line-height: 1.6; }
        .btn { padding: 10px 18px; border: none; border-radius: 6px; cursor: pointer; text-decoration: none; font-weight: bold; font-size: 0.95rem; display: inline-block; }
        .btn-logout { background-color: #dc2626; color: white; }
        .btn-store { background-color: #2563eb; color: white; margin-left: 10px; }
        .actions-box { display: flex; align-items: center; gap: 10px; margin-top: 24px; }
    </style>
</head>
<body>

    <!-- Greet the user using their logged-in username -->
    <h1>Welcome, {{ request.user.username }}! 👋</h1>
    <p>You are now logged in.</p>

    <!-- Navigation actions -->
    <div class="actions-box">
        <!-- Secure POST Logout Form -->
        <form method="POST" action="{% url 'grabsomore:logout' %}" style="display: inline; margin: 0;">
            {% csrf_token %}
            <button type="submit" class="btn btn-logout">🚪 Logout</button>
        </form>

        <!-- Direct Link to the Store Catalog -->
        <a href="{% url 'eCommerce:products_list' %}" class="btn btn-store">🛍️ Go to Store</a>
    </div>

</body>
</html>
