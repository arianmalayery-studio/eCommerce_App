{% extends 'eCommerce/base.html' %}

{% block title %}{{ action }} Product | GrabSoMore{% endblock %}

{% block content %}
<div style="margin-bottom: 20px;">
    <a href="{% url 'eCommerce:vendor_dashboard' %}" class="btn btn-slate" style="font-size: 0.85rem;">⬅️ Back to Dashboard</a>
</div>

<div class="card" style="max-width: 550px; margin: 0 auto;">
    <h1 style="margin: 0 0 8px 0; font-size: 1.5rem; color: #0f172a;">📦 {{ action }} Product</h1>
    <p style="color: #64748b; margin: 0 0 20px 0;">
        Storefront: <strong>🏪 {{ store.name }}</strong>
    </p>

    <form method="POST">
        {% csrf_token %}
        <div style="margin-bottom: 16px;">
            <label for="name" style="display: block; font-weight: bold; margin-bottom: 6px;">Product Name:</label>
            <input type="text" id="name" name="name" value="{{ product.name|default:'' }}" required style="width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box;">
        </div>

        <div style="display: flex; gap: 16px; margin-bottom: 16px;">
            <div style="flex: 1;">
                <label for="price" style="display: block; font-weight: bold; margin-bottom: 6px;">Price ($):</label>
                <input type="number" step="0.01" id="price" name="price" value="{{ product.price|default:'' }}" required style="width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box;">
            </div>
            <div style="flex: 1;">
                <label for="stock" style="display: block; font-weight: bold; margin-bottom: 6px;">Stock Quantity:</label>
                <input type="number" id="stock" name="stock" value="{{ product.stock|default:'0' }}" required style="width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box;">
            </div>
        </div>

        <div style="margin-bottom: 20px;">
            <label for="description" style="display: block; font-weight: bold; margin-bottom: 6px;">Description:</label>
            <textarea id="description" name="description" rows="4" style="width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box;">{{ product.description|default:'' }}</textarea>
        </div>

        <button type="submit" class="btn btn-blue" style="width: 100%; padding: 10px; font-size: 1rem;">💾 Save Product</button>
    </form>
</div>
{% endblock %}
