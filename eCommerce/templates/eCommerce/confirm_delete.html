{% extends 'eCommerce/base.html' %}

{% block title %}Confirm Deletion | GrabSoMore{% endblock %}

{% block content %}
<div class="card" style="max-width: 480px; margin: 40px auto; text-align: center;">
    <h1 style="margin: 0 0 12px 0; color: #dc2626; font-size: 1.5rem;">⚠️ Confirm Removal</h1>
    <p style="color: #334155; margin: 0 0 20px 0; font-size: 1rem;">
        Are you sure you want to permanently delete the {{ type }}:<br>
        <strong style="color: #0f172a; font-size: 1.1rem;">"{{ item.name }}"</strong>?
    </p>

    <form method="POST" style="display: flex; justify-content: center; gap: 12px; margin: 0;">
        {% csrf_token %}
        <button type="submit" class="btn btn-red" style="padding: 10px 20px;">Yes, Delete</button>
        <a href="{% url 'eCommerce:vendor_dashboard' %}" class="btn btn-slate" style="padding: 10px 20px;">Cancel</a>
    </form>
</div>
{% endblock %}
